<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FutureMe</title>
  <meta name="theme-color" content="#050E1A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=IM+Fell+English:ital@0;1&family=DM+Sans:wght@400;500;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'KyivTypeSerif';
      src: url('./KyivTypeSerif-Bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #050E1A; /* Base fallback */
      color: #E8D5B5;
      overflow: hidden;
      /* Prevent scrolling for app-like feel */
      user-select: none;
      /* Prevent text selection */
      -webkit-user-select: none;
    }

    img {
      -webkit-user-drag: none;
      /* Prevent image dragging */
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    a {
      cursor: pointer;
    }

    h1,
    h2,
    h3,
    .brand-font {
      font-family: 'IM Fell English', serif;
      letter-spacing: 0.02em;
    }

    .countdown-font {
      font-family: 'KyivTypeSerif', serif;
    }

    /* Custom scrollbar for content areas */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #141024;
    }

    ::-webkit-scrollbar-thumb {
      background: #3D3052;
      border-radius: 4px;
    }

    /* Animations */
    @keyframes ping-large {

      75%,
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    .animate-ping-large {
      animation: ping-large 1s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fade-in 1s ease-out forwards;
    }

    @keyframes slide-up {
      from {
        transform: translateY(100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slide-up {
      animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slide-in-bottom {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .animate-slide-in-bottom {
      animation: slide-in-bottom 0.5s ease-out forwards;
    }

    @keyframes pulse-slow {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .animate-pulse-slow {
      animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .animate-pulse-medium {
      animation: pulse-slow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes flash-out {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .animate-flash-out {
      animation: flash-out 0.8s ease-out forwards;
    }

    @keyframes scale-in {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-scale-in {
      animation: scale-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bokeh-1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(8vw, 6vh) scale(1.15); }
    }
    @keyframes bokeh-2 {
      0%, 100% { transform: translate(0, 0) scale(1.1); }
      50% { transform: translate(-10vw, -8vh) scale(0.9); }
    }
    @keyframes bokeh-3 {
      0%, 100% { transform: translate(0, 0) scale(0.95); }
      50% { transform: translate(6vw, -5vh) scale(1.1); }
    }
    .animate-bokeh-drift-1 { animation: bokeh-1 32s ease-in-out infinite; }
    .animate-bokeh-drift-2 { animation: bokeh-2 26s ease-in-out infinite; }
    .animate-bokeh-drift-3 { animation: bokeh-3 29s ease-in-out infinite; }

    @keyframes spin-clockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-anticlockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .animate-spin-clockwise {
      animation: spin-clockwise 3.5s linear infinite !important;
    }
    .animate-spin-anticlockwise {
      animation: spin-anticlockwise 3.5s linear infinite !important;
    }
  </style>
</head>

<body>

  <!-- Cinematic Depth of Field Bokeh Light leaks -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none mix-blend-screen">
    <div class="absolute -top-1/4 -left-1/4 w-[85vw] h-[85vw] rounded-full bg-[#1C2C5E]/30 blur-[130px] animate-bokeh-drift-1"></div>
    <div class="absolute -bottom-1/4 -right-1/4 w-[80vw] h-[80vw] rounded-full bg-[#821B27]/20 blur-[130px] animate-bokeh-drift-2"></div>
    <div class="absolute top-1/3 left-1/3 w-[65vw] h-[65vw] rounded-full bg-[#FAF6EE]/5 blur-[140px] animate-bokeh-drift-3"></div>
  </div>
  <div id="root" class="relative z-10"></div>
  <script type="module" src="./index.tsx"></script>
  <script>
    // Robust global prevention of image dragging
    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    }, false);
  </script>
</body>

</html>
